<!doctype html>
<html lang="id">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookshelf App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Impor script kamu di sini -->
    <!-- Lampirkan `defer` jika pemanggilan dilakukan dalam <head> -->
    <script defer src="main.js"></script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Bookshelf App</h1>
      <button id="themeToggle" aria-label="Toggle tema">
        <span class="theme-icon">☀️</span>
        <span class="theme-label">Light</span>
      </button>
    </header>

    <main>
      <!-- ============ TAMBAH BUKU ============ -->
      <section>
        <h2 class="h2--add">Tambah Buku Baru</h2>
        <form id="bookForm" data-testid="bookForm">
          <div class="form-group">
            <label for="bookFormTitle">Judul</label>
            <input
              id="bookFormTitle"
              type="text"
              placeholder="Masukkan judul buku..."
              required
              data-testid="bookFormTitleInput"
            />
            <span id="titleError" class="field-error"></span>
          </div>
          <div class="form-group">
            <label for="bookFormAuthor">Penulis</label>
            <input
              id="bookFormAuthor"
              type="text"
              placeholder="Nama penulis..."
              required
              data-testid="bookFormAuthorInput"
            />
            <span id="authorError" class="field-error"></span>
          </div>
          <!-- Validasi: tambah span error di bawah input tahun -->
          <div class="form-group">
            <label for="bookFormYear">Tahun</label>
            <input
              id="bookFormYear"
              type="number"
              placeholder="Tahun terbit..."
              required
              data-testid="bookFormYearInput"
            />
            <span id="yearError" class="field-error"></span>
          </div>
          <div class="checkbox-row">
            <input
              id="bookFormIsComplete"
              type="checkbox"
              data-testid="bookFormIsCompleteCheckbox"
            />
            <label for="bookFormIsComplete" class="toggle-switch-ui"></label>
            <label for="bookFormIsComplete">Selesai dibaca</label>
          </div>
          <button
            id="bookFormSubmit"
            type="submit"
            data-testid="bookFormSubmitButton"
          >
            Masukkan Buku ke rak <span>Belum selesai dibaca</span>
          </button>
        </form>
      </section>

      <!-- ============ CARI BUKU ============ -->
      <section>
        <h2 class="h2--search">Cari Buku</h2>
        <form id="searchBook" data-testid="searchBookForm">
          <div class="form-group">
            <label for="searchBookTitle">Judul</label>
            <input
              id="searchBookTitle"
              type="text"
              placeholder="Cari berdasarkan judul... (Ctrl+F)"
              data-testid="searchBookFormTitleInput"
            />
          </div>
          <button
            id="searchSubmit"
            type="submit"
            data-testid="searchBookFormSubmitButton"
          >
            Cari
          </button>
        </form>
      </section>

      <!-- ============ RAK BUKU ============ -->
      <!-- Badge counter ada di dalam <h2>, diupdate oleh JS -->
      <div class="shelves-grid">
        <section>
          <h2 class="h2--incomplete">
            Belum selesai dibaca
            <span id="incompleteCount" class="badge">0</span>
          </h2>
          <div id="incompleteBookList" data-testid="incompleteBookList">
            <!-- book items inserted by JS -->
          </div>
        </section>

        <section>
          <h2 class="h2--complete">
            Selesai dibaca
            <span id="completeCount" class="badge">0</span>
          </h2>
          <div id="completeBookList" data-testid="completeBookList">
            <!-- book items inserted by JS -->
          </div>
        </section>
      </div>
    </main>

    <!-- ============ MODAL EDIT BUKU ============ -->
    <div
      id="editModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="editModalTitle"
    >
      <div class="modal-box">
        <h2 id="editModalTitle">Edit Buku</h2>
        <form id="editBookForm">
          <input type="hidden" id="editBookId" />
          <div class="form-group">
            <label for="editBookTitle">Judul</label>
            <input id="editBookTitle" type="text" required />
          </div>
          <div class="form-group">
            <label for="editBookAuthor">Penulis</label>
            <input id="editBookAuthor" type="text" required />
          </div>
          <div class="form-group">
            <label for="editBookYear">Tahun</label>
            <input id="editBookYear" type="number" required />
          </div>
          <div class="checkbox-row">
            <input id="editBookIsComplete" type="checkbox" />
            <label for="editBookIsComplete" class="toggle-switch-ui"></label>
            <label for="editBookIsComplete">Selesai dibaca</label>
          </div>
          <div class="modal-actions">
            <button type="submit" id="editFormSave">Simpan Perubahan</button>
            <button type="button" id="editFormCancel">Batal</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ============ TOAST CONTAINER ============ -->
    <div class="toast-container" id="toastContainer"></div>
  </body>
</html>

<!doctype html>
<html lang="id">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookshelf App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Impor script kamu di sini -->
    <!-- Lampirkan `defer` jika pemanggilan dilakukan dalam <head> -->
    <script defer src="main.js"></script>

    <style>
      /* ============================
         CSS RESET & VARIABLES
         ============================ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --clr-bg: #0f1117;
        --clr-surface: #1a1d27;
        --clr-card: #21253a;
        --clr-card-hover: #262b42;
        --clr-border: #2e3350;
        --clr-primary: #6c63ff;
        --clr-primary-hover: #7c74ff;
        --clr-accent: #ff6584;
        --clr-success: #43d9ad;
        --clr-warning: #ffa657;
        --clr-danger: #ff6b6b;
        --clr-text: #e2e8f0;
        --clr-text-muted: #8892a4;
        --clr-text-dim: #4a5568;
        --radius-sm: 6px;
        --radius-md: 12px;
        --radius-lg: 18px;
        --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.35);
        --shadow-modal: 0 20px 60px rgba(0, 0, 0, 0.7);
        --transition: 0.2s ease;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--clr-bg);
        color: var(--clr-text);
        min-height: 100vh;
        line-height: 1.6;
      }

      /* ============================
         HEADER
         ============================ */
      header {
        background: linear-gradient(135deg, #1a1d27 0%, #12152a 100%);
        border-bottom: 1px solid var(--clr-border);
        padding: 20px 24px;
        text-align: center;
        position: sticky;
        top: 0;
        z-index: 100;
        backdrop-filter: blur(10px);
      }

      header h1 {
        font-size: 1.6rem;
        font-weight: 800;
        background: linear-gradient(90deg, #6c63ff, #ff6584);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.5px;
      }

      header h1::before {
        content: "📚 ";
        -webkit-text-fill-color: initial;
      }

      /* ============================
         MAIN LAYOUT
         ============================ */
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 20px 60px;
        display: grid;
        gap: 28px;
      }

      section {
        background: var(--clr-surface);
        border: 1px solid var(--clr-border);
        border-radius: var(--radius-lg);
        padding: 28px 28px 32px;
        box-shadow: var(--shadow-card);
      }

      h2 {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--clr-text);
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--clr-border);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      h2.h2--incomplete::before {
        content: "📖";
      }
      h2.h2--complete::before {
        content: "✅";
      }
      h2.h2--add::before {
        content: "✏️";
      }
      h2.h2--search::before {
        content: "🔍";
      }

      /* ============================
         FORM — ADD BOOK
         ============================ */
      #bookForm {
        display: grid;
        gap: 16px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      label {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--clr-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      input[type="text"],
      input[type="number"] {
        background: var(--clr-card);
        border: 1.5px solid var(--clr-border);
        border-radius: var(--radius-sm);
        padding: 11px 14px;
        color: var(--clr-text);
        font-family: inherit;
        font-size: 0.95rem;
        transition:
          border-color var(--transition),
          box-shadow var(--transition);
        outline: none;
        width: 100%;
      }

      input[type="text"]:focus,
      input[type="number"]:focus {
        border-color: var(--clr-primary);
        box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.18);
      }

      input[type="text"]::placeholder,
      input[type="number"]::placeholder {
        color: var(--clr-text-dim);
      }

      /* Checkbox row */
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
      }

      .checkbox-row input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--clr-primary);
        cursor: pointer;
        flex-shrink: 0;
      }

      .checkbox-row label {
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--clr-text);
        text-transform: none;
        letter-spacing: 0;
        cursor: pointer;
      }

      /* Submit button */
      #bookFormSubmit {
        background: linear-gradient(135deg, var(--clr-primary), #8b5cf6);
        color: #fff;
        border: none;
        border-radius: var(--radius-sm);
        padding: 12px 20px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          opacity var(--transition),
          transform var(--transition);
        margin-top: 4px;
      }

      #bookFormSubmit:hover {
        opacity: 0.88;
        transform: translateY(-1px);
      }

      #bookFormSubmit span {
        font-weight: 700;
        color: #ffd700;
      }

      /* ============================
         FORM — SEARCH
         ============================ */
      #searchBook {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }

      #searchBook label {
        margin-bottom: 6px;
      }

      #searchBook .form-group {
        flex: 1;
      }

      #searchSubmit {
        background: var(--clr-card);
        color: var(--clr-text);
        border: 1.5px solid var(--clr-border);
        border-radius: var(--radius-sm);
        padding: 11px 18px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          background var(--transition),
          border-color var(--transition);
        white-space: nowrap;
        height: 44px;
      }

      #searchSubmit:hover {
        background: var(--clr-primary);
        border-color: var(--clr-primary);
        color: #fff;
      }

      /* ============================
         BOOK SHELVES
         ============================ */
      .shelves-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }

      @media (max-width: 720px) {
        .shelves-grid {
          grid-template-columns: 1fr;
        }
      }

      #incompleteBookList,
      #completeBookList {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 80px;
      }

      /* Empty state */
      .empty-shelf {
        text-align: center;
        padding: 32px 16px;
        color: var(--clr-text-dim);
        font-size: 0.88rem;
        border: 2px dashed var(--clr-border);
        border-radius: var(--radius-md);
        user-select: none;
      }

      .empty-shelf::before {
        display: block;
        font-size: 2rem;
        margin-bottom: 8px;
        content: "🪹";
      }

      /* ============================
         BOOK CARD
         ============================ */
      [data-testid="bookItem"] {
        background: var(--clr-card);
        border: 1px solid var(--clr-border);
        border-radius: var(--radius-md);
        padding: 18px 18px 14px;
        transition:
          background var(--transition),
          transform var(--transition),
          box-shadow var(--transition);
        animation: fadeSlideIn 0.25s ease forwards;
      }

      [data-testid="bookItem"]:hover {
        background: var(--clr-card-hover);
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
      }

      @keyframes fadeSlideIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      [data-testid="bookItemTitle"] {
        font-size: 0.98rem;
        font-weight: 700;
        color: var(--clr-text);
        margin-bottom: 6px;
        line-height: 1.4;
      }

      [data-testid="bookItemAuthor"],
      [data-testid="bookItemYear"] {
        font-size: 0.82rem;
        color: var(--clr-text-muted);
        margin-bottom: 2px;
      }

      /* Book actions */
      .book-actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }

      .book-actions button {
        border: none;
        border-radius: var(--radius-sm);
        padding: 7px 12px;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          opacity var(--transition),
          transform var(--transition);
        font-family: inherit;
      }

      .book-actions button:hover {
        opacity: 0.82;
        transform: translateY(-1px);
      }

      [data-testid="bookItemIsCompleteButton"] {
        background: var(--clr-success);
        color: #0a2620;
      }

      [data-testid="bookItemDeleteButton"] {
        background: var(--clr-danger);
        color: #fff;
      }

      [data-testid="bookItemEditButton"] {
        background: var(--clr-warning);
        color: #2d1a00;
      }

      /* ============================
         MODAL — EDIT BOOK
         ============================ */
      #editModal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 500;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(4px);
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      #editModal.open {
        display: flex;
        animation: fadeIn 0.18s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .modal-box {
        background: var(--clr-surface);
        border: 1px solid var(--clr-border);
        border-radius: var(--radius-lg);
        padding: 32px;
        width: 100%;
        max-width: 480px;
        box-shadow: var(--shadow-modal);
        animation: slideUp 0.22s ease;
      }

      @keyframes slideUp {
        from {
          transform: translateY(24px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .modal-box h2 {
        border: none;
        padding-bottom: 0;
        margin-bottom: 24px;
        font-size: 1.15rem;
      }

      #editBookForm {
        display: grid;
        gap: 16px;
      }

      .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }

      #editFormSave {
        flex: 1;
        background: linear-gradient(135deg, var(--clr-primary), #8b5cf6);
        color: #fff;
        border: none;
        border-radius: var(--radius-sm);
        padding: 12px 20px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: opacity var(--transition);
      }

      #editFormSave:hover {
        opacity: 0.85;
      }

      #editFormCancel {
        background: var(--clr-card);
        color: var(--clr-text-muted);
        border: 1.5px solid var(--clr-border);
        border-radius: var(--radius-sm);
        padding: 12px 20px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: background var(--transition);
      }

      #editFormCancel:hover {
        background: var(--clr-card-hover);
        color: var(--clr-text);
      }

      /* ============================
         RESPONSIVE
         ============================ */
      @media (max-width: 600px) {
        main {
          padding: 20px 12px 48px;
        }
        section {
          padding: 20px 16px 24px;
        }
        .modal-box {
          padding: 24px 18px;
        }
        #searchBook {
          flex-direction: column;
        }
        #searchSubmit {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Bookshelf App</h1>
    </header>

    <main>
      <!-- ============ TAMBAH BUKU ============ -->
      <section>
        <h2 class="h2--add">Tambah Buku Baru</h2>
        <form id="bookForm" data-testid="bookForm">
          <div class="form-group">
            <label for="bookFormTitle">Judul</label>
            <input
              id="bookFormTitle"
              type="text"
              placeholder="Masukkan judul buku..."
              required
              data-testid="bookFormTitleInput"
            />
          </div>
          <div class="form-group">
            <label for="bookFormAuthor">Penulis</label>
            <input
              id="bookFormAuthor"
              type="text"
              placeholder="Nama penulis..."
              required
              data-testid="bookFormAuthorInput"
            />
          </div>
          <div class="form-group">
            <label for="bookFormYear">Tahun</label>
            <input
              id="bookFormYear"
              type="number"
              placeholder="Tahun terbit..."
              required
              data-testid="bookFormYearInput"
            />
          </div>
          <div class="checkbox-row">
            <input
              id="bookFormIsComplete"
              type="checkbox"
              data-testid="bookFormIsCompleteCheckbox"
            />
            <label for="bookFormIsComplete">Selesai dibaca</label>
          </div>
          <button
            id="bookFormSubmit"
            type="submit"
            data-testid="bookFormSubmitButton"
          >
            Masukkan Buku ke rak <span>Belum selesai dibaca</span>
          </button>
        </form>
      </section>

      <!-- ============ CARI BUKU ============ -->
      <section>
        <h2 class="h2--search">Cari Buku</h2>
        <form id="searchBook" data-testid="searchBookForm">
          <div class="form-group">
            <label for="searchBookTitle">Judul</label>
            <input
              id="searchBookTitle"
              type="text"
              placeholder="Cari berdasarkan judul..."
              data-testid="searchBookFormTitleInput"
            />
          </div>
          <button
            id="searchSubmit"
            type="submit"
            data-testid="searchBookFormSubmitButton"
          >
            Cari
          </button>
        </form>
      </section>

      <!-- ============ RAK BUKU ============ -->
      <div class="shelves-grid">
        <section>
          <h2 class="h2--incomplete">Belum selesai dibaca</h2>
          <div id="incompleteBookList" data-testid="incompleteBookList">
            <!-- book items inserted by JS -->
          </div>
        </section>

        <section>
          <h2 class="h2--complete">Selesai dibaca</h2>
          <div id="completeBookList" data-testid="completeBookList">
            <!-- book items inserted by JS -->
          </div>
        </section>
      </div>
    </main>

    <!-- ============ MODAL EDIT BUKU ============ -->
    <div
      id="editModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="editModalTitle"
    >
      <div class="modal-box">
        <h2 id="editModalTitle">✏️ Edit Buku</h2>
        <form id="editBookForm">
          <input type="hidden" id="editBookId" />
          <div class="form-group">
            <label for="editBookTitle">Judul</label>
            <input id="editBookTitle" type="text" required />
          </div>
          <div class="form-group">
            <label for="editBookAuthor">Penulis</label>
            <input id="editBookAuthor" type="text" required />
          </div>
          <div class="form-group">
            <label for="editBookYear">Tahun</label>
            <input id="editBookYear" type="number" required />
          </div>
          <div class="checkbox-row">
            <input id="editBookIsComplete" type="checkbox" />
            <label for="editBookIsComplete">Selesai dibaca</label>
          </div>
          <div class="modal-actions">
            <button type="submit" id="editFormSave">Simpan Perubahan</button>
            <button type="button" id="editFormCancel">Batal</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
